name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  release:
    # This runner must be trusted and have access to its own Starsector installation.
    runs-on: [self-hosted, linux, starsector]
    env:
      STARSECTOR_CORE: ${{ vars.STARSECTOR_CORE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify mod
        shell: bash
        run: |
          set -euo pipefail
          : "${STARSECTOR_CORE:?Set the STARSECTOR_CORE repository variable to the runner core directory}"
          test -d "$STARSECTOR_CORE"
          bash ./gradlew clean build -PcorePath="$STARSECTOR_CORE"
      - name: Publish rolling prerelease
        shell: bash
        run: |
          set -euo pipefail
          # A delayed manual run or older build must not replace a newer commit.
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'The default branch has moved; skip this stale build.'
            exit 0
          fi
          shopt -s nullglob
          archives=(build/distributions/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo 'Expected exactly one mod ZIP.' >&2
            exit 1
          fi
          tag=dev-latest
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title 'Latest development build' \
              --notes "Built from commit $GITHUB_SHA."
          else
            gh release edit "$tag" --prerelease --title 'Latest development build' \
              --notes "Built from commit $GITHUB_SHA."
          fi
          gh release upload "$tag" "${archives[0]}" --clobber
          # Remove ZIPs from previous mod versions only after the new upload succeeds.
          current=$(basename "${archives[0]}")
          while IFS= read -r name; do
            if [[ "$name" == *.zip && "$name" != "$current" ]]; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
