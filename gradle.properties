# Campaign Radial Menu build settings.
modFolderName=RadialMenu
javaRelease=8
extraPackageIncludes=BUILDING.md

# Reuse the Gradle JVM between builds.
org.gradle.daemon=true

# Allow independent projects to execute in parallel.
org.gradle.parallel=true

# Reuse task outputs between builds.
org.gradle.caching=true

# Reuse the configured task graph between builds.
org.gradle.configuration-cache=true

# Keep the build JVM's encoding deterministic; Starsector mod assets and sources are UTF-8.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
